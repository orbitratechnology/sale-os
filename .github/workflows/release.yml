name: Release build (Windows)

# Production (release-profile) Windows installers for the pilot, plus the tools for the pilot
# PC's reference runs. Run it from the Actions tab ("Run workflow", once this file is on the
# default branch), by pushing a tag v*, or by changing this file on any branch.
#
# The cloud is optional at run time: set POS_CLOUD_URL on the till to link it. Without it
# the till works on its own (no hosting is chosen yet, D-06).
#
# Not signed yet: code signing and auto-update wait for the certificate and update key
# (E19-T06). Until then Windows SmartScreen warns about an unknown publisher; check the
# SHA-256 in SHA256SUMS.txt before installing (pilot runbook §1).

on:
  workflow_dispatch:
  push:
    # Tags always build (path filters are not applied to tags); a branch push builds only
    # when this file changed.
    branches: ["**"]
    tags: ["v*"]
    paths: [".github/workflows/release.yml"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    name: Release installers and pilot tools (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: tauri build (release, NSIS + MSI)
        run: pnpm tauri build
      - name: Pilot tools (performance suite)
        run: cargo build --release --locked -p pos-bench
      - name: Pilot tools (UI latency kit)
        # scripts/ui-latency.mjs with the Node runtime and playwright-core next to it, so the
        # pilot PC needs nothing installed (pilot runbook §11). No browser is downloaded: it
        # attaches to the app's own WebView2.
        shell: pwsh
        run: |
          $kit = New-Item -ItemType Directory -Force -Path ui-latency-kit
          Copy-Item apps/desktop-ui/scripts/ui-latency.mjs $kit
          Copy-Item (Get-Command node).Source $kit
          $version = (Get-Content apps/desktop-ui/package.json | ConvertFrom-Json).devDependencies.playwright
          '{ "type": "module", "private": true }' | Set-Content -Encoding ascii "$kit/package.json"
          Push-Location $kit
          npm install --no-audit --no-fund --omit=dev "playwright-core@$version"
          Pop-Location
          @(
            "Sale OS UI latency kit (pilot runbook section 11).",
            "Close Sale OS, then in PowerShell in this folder:",
            '  .\node.exe ui-latency.mjs --launch "<path to Sale OS.exe>" --codes <barcode>,<barcode>,<barcode> --search <letters> --json ui-latency.json'
          ) | Set-Content -Encoding ascii "$kit/README.txt"
          Compress-Archive -Path "$kit/*" -DestinationPath ui-latency.zip -Force
      - name: Collect, with checksums
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force -Path dist-release
          Copy-Item target/release/bundle/nsis/*.exe $out
          Copy-Item target/release/bundle/msi/*.msi $out
          New-Item -ItemType Directory -Force -Path "$out/pilot-tools" | Out-Null
          Copy-Item target/release/pos-bench.exe "$out/pilot-tools/"
          Copy-Item ui-latency.zip "$out/pilot-tools/"
          $lines = Get-ChildItem -Recurse -File $out | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$hash  $($_.FullName.Substring($out.FullName.Length + 1).Replace('\', '/'))"
          }
          $lines | Set-Content -Encoding ascii "$out/SHA256SUMS.txt"
          Get-Content "$out/SHA256SUMS.txt"
          # Sizes, so a change in what we ship shows in the log.
          Get-ChildItem -Recurse -File $out | ForEach-Object { "{0,14:N0} bytes  {1}" -f $_.Length, $_.FullName.Substring($out.FullName.Length + 1) }
          if (Test-Path ui-latency-kit) {
            Get-ChildItem -Recurse -File ui-latency-kit | Sort-Object Length -Descending | Select-Object -First 5 | ForEach-Object { "{0,14:N0} bytes  ui-latency-kit/{1}" -f $_.Length, $_.Name }
          }
          "commit $env:GITHUB_SHA" | Set-Content -Encoding ascii "$out/BUILD.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: sale-os-windows-release-${{ github.sha }}
          path: dist-release
          if-no-files-found: error
          retention-days: 90

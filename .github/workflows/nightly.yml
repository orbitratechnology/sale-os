name: Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  durability:
    name: Durability (crash harness + write-path stress)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Crash harness (E02-T04)
        run: cargo xtask crash-harness --kills 100 --report crash-report.txt
      - name: 10,000 concurrent applies (E02-T03)
        run: cargo test -p pos-local-db --release --test apply concurrent
        env:
          POS_APPLY_STRESS: "1250"
      - name: PIN hash cost (E05-T02, 50-300 ms per verification)
        run: cargo test -p pos-application --release -- --ignored production_pin_hash_cost --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crash-report-${{ github.run_id }}
          path: crash-report.txt
          if-no-files-found: ignore

  sync-faults:
    name: Sync under network faults (E17-T10, full AT-06 matrix)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sale_os_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/sale_os_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Every fault scenario, kill-and-restart, flapping during checkout
        run: cargo test -p sync-e2e --release --test faults -- --include-ignored --nocapture

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: tests
        run: cargo test --workspace --locked
      - name: dependency rules
        run: cargo xtask check-deps
      - name: generated contracts are current
        run: |
          cargo xtask gen-bindings --check
          cargo xtask gen-schemas --check
          cargo xtask schema-compat
      - name: requirement traceability
        run: cargo xtask trace

  cloud-postgres:
    name: Cloud API and sync end to end against PostgreSQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sale_os_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/sale_os_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p cloud-api -p pos-cloud-db --locked
      # Registers linked to the real API over HTTP (E17-T08), and the AT-06 smoke subset of
      # the network fault matrix (E17-T10; the full matrix runs nightly).
      - run: cargo test -p sync-e2e --locked
      # E16-T06: property-based contract tests of the real API (Schemathesis): no 5xx, and every
      # status, content type and body as the contract declares, for valid and invalid input.
      - run: pipx install schemathesis==4.33.4
      - run: scripts/contract-fuzz.sh
        env:
          CONTRACT_REPORT_DIR: ${{ runner.temp }}/contract-fuzz
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contract-fuzz
          path: ${{ runner.temp }}/contract-fuzz

  cargo-deny:
    name: cargo-deny (licences, advisories, bans, sources)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  frontend:
    name: Frontend + contracts (lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:contracts
      - run: pnpm typecheck
      - run: pnpm test
      - name: Browser tests (keyboard-wedge capture in Chromium)
        run: |
          pnpm --filter @sale-os/desktop-ui exec playwright install --with-deps chromium
          pnpm --filter @sale-os/desktop-ui test:e2e
      - run: pnpm --filter @sale-os/desktop-ui build

  # E19-T12: AT-01…AT-13 by name, on Windows and Linux, against a real PostgreSQL (the runner
  # images ship one, stopped). The report is kept as an artefact for the pilot go/no-go.
  acceptance:
    name: MVP acceptance suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Start PostgreSQL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres'"
          sudo -u postgres createdb sale_os_test
          echo "TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/sale_os_test" >> "$GITHUB_ENV"
      - name: Start PostgreSQL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $svc = Get-Service -Name "postgresql*"
          Set-Service -InputObject $svc -StartupType Manual
          Start-Service -InputObject $svc
          $env:PGPASSWORD = "root"
          & "$env:PGBIN\createdb.exe" -U postgres -h localhost sale_os_test
          "TEST_DATABASE_URL=postgres://postgres:root@localhost:5432/sale_os_test" >> $env:GITHUB_ENV
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sale-os/desktop-ui exec playwright install --with-deps chromium
      - name: cargo xtask acceptance
        run: cargo xtask acceptance --report acceptance-report
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-report-${{ matrix.os }}-${{ github.sha }}
          path: acceptance-report
          if-no-files-found: warn

  desktop-windows:
    name: Desktop build (Windows installer artefact)
    needs: [rust, frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: tauri build (debug, NSIS + MSI)
        run: pnpm tauri build --debug
      - uses: actions/upload-artifact@v4
        with:
          name: sale-os-windows-debug-${{ github.sha }}
          path: |
            target/debug/bundle/nsis/*.exe
            target/debug/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

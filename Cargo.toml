[workspace]
resolver = "3"
members = [
  "crates/*",
  "apps/desktop-tauri",
  "apps/cloud-api",
  "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[workspace.dependencies]
# internal
pos-domain = { path = "crates/pos-domain" }
pos-observability = { path = "crates/pos-observability" }
pos-application = { path = "crates/pos-application" }
pos-local-db = { path = "crates/pos-local-db" }
pos-cloud-db = { path = "crates/pos-cloud-db" }
pos-sync = { path = "crates/pos-sync" }
pos-device-ports = { path = "crates/pos-device-ports" }
pos-device-virtual = { path = "crates/pos-device-virtual" }
pos-receipts = { path = "crates/pos-receipts" }
pos-testkit = { path = "crates/pos-testkit" }

# external
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10"
proptest = "1"
jsonschema = { version = "=0.58.6", default-features = false }
serde_yaml_ng = "0.10"
rust_decimal = { version = "1.43", default-features = false, features = ["std", "serde-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
strum = { version = "0.27", features = ["derive"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "macros", "migrate"] }
tauri = { version = "2.12", features = [] }
tauri-build = { version = "2.7", features = [] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.29", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

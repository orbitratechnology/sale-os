openapi: 3.1.0
info:
  title: Sale OS Cloud API
  version: 1.0.0-stage0
  summary: Device sync, owner accounts and consolidated reports for Sale OS registers.
  description: |
    Source of truth for the cloud REST contract (docs/backlog/07-contracts.md §3).
    Covers the service endpoints and owner sign-up / sign-in (E16-T03). Devices, sync and
    reports are added by E16-T04..T06 and E17. Errors use RFC 9457 problem+json carrying a catalogued `code`
    (docs/errors.md).
  contact:
    name: Sale OS engineering
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.sale-os.example
    description: Placeholder until D-06 (hosting region) is decided.
tags:
  - name: service
    description: Health and version policy.
  - name: auth
    description: Owner accounts (E16-T03).
  - name: devices
    description: Businesses, device registration, token rotation and revocation (E16-T04).
  - name: sync
    description: Event push and acknowledgement (E17-T04).
paths:
  /v1/health:
    get:
      operationId: getHealth
      tags: [service]
      summary: Liveness and database reachability.
      security: []
      responses:
        "200":
          description: The API is up. `database` is `ok` or `not_configured`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: The API is up but its database is unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        default:
          description: Any error, as RFC 9457 problem+json with a catalogued `code`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/version-policy:
    get:
      operationId: getVersionPolicy
      tags: [service]
      summary: Minimum and latest supported desktop app versions (E19-T09).
      security: []
      responses:
        "200":
          description: The current policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionPolicy"
        default:
          description: Any error, as RFC 9457 problem+json with a catalogued `code`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Creates an owner account (rate-limited per client address, 5 a minute).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: The account was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupResponse"
        "409":
          description: "`AUTH_EMAIL_TAKEN`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: "`VALIDATION_FAILED`: not an email, or the password is shorter than 10 characters or too common."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: "`AUTH_RATE_LIMITED`; `Retry-After` gives the seconds to wait."
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          description: Any other error.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Signs an owner in; returns a 15-minute user token (EdDSA JWT).
      description: |
        A wrong password and an unknown email give the same status, body and (on average)
        time. Rate-limited per client address and per email: 5 a minute, then blocks of
        1, 2, 4… minutes (at most an hour).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: "`AUTH_CREDENTIALS_INVALID`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: "`AUTH_RATE_LIMITED`; `Retry-After` gives the seconds to wait."
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          description: Any other error.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/businesses:
    post:
      operationId: createBusiness
      tags: [devices]
      summary: Creates the cloud business for a till's workspace (client-generated id).
      description: Idempotent for the same owner and id (200 with the existing business).
      security:
        - userToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewBusiness"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "200":
          description: Already created by this owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "401":
          description: "`AUTH_REQUIRED`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "`SYNC_BUSINESS_ID_TAKEN`: another account owns this id."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: "`VALIDATION_FAILED`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          description: Any other error.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: listBusinesses
      tags: [devices]
      summary: The businesses the owner belongs to (the "join existing" path, D-10).
      security:
        - userToken: []
      responses:
        "200":
          description: The owner's businesses.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Business"
        "401":
          description: "`AUTH_REQUIRED`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          description: Any other error.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/devices/register:
    post:
      operationId: registerDevice
      tags: [devices]
      summary: Links this installation to a register of the owner's business.
      description: |
        Creates the location and register if the cloud does not have them yet. A device already
        active on the register is revoked only with `replaceExisting: true` (the owner confirmed);
        otherwise `409 SYNC_REGISTER_IN_USE`. Another owner's business, or none: `404 NOT_FOUND`.
      security:
        - userToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDevice"
      responses:
        "201":
          description: Linked. The refresh token is shown once; only its hash is stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCredentials"
        "401":
          description: "`AUTH_REQUIRED`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: "`NOT_FOUND`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "`SYNC_REGISTER_IN_USE`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: "`VALIDATION_FAILED`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          description: Any other error.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/auth/device/refresh:
    post:
      operationId: refreshDevice
      tags: [devices]
      summary: Rotates the device's refresh token and issues a new 15-minute access token.
      description: Reusing a spent refresh token revokes the device (`401 SYNC_DEVICE_REVOKED`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  writeOnly: true
      responses:
        "200":
          description: New tokens; the old refresh token is spent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCredentials"
        "401":
          description: "`SYNC_DEVICE_REVOKED` (revoked, or a spent token reused) or `AUTH_REQUIRED` (unknown or expired: link again)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          description: Any other error.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/devices:
    get:
      operationId: listDevices
      tags: [devices]
      summary: The devices of the owner's businesses.
      security:
        - userToken: []
      responses:
        "200":
          description: Devices.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
        "401":
          description: "`AUTH_REQUIRED`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          description: Any other error.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/devices/{deviceId}/revoke:
    post:
      operationId: revokeDevice
      tags: [devices]
      summary: Disconnects a device at once (its next request gets `401 SYNC_DEVICE_REVOKED`).
      security:
        - userToken: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked.
        "401":
          description: "`AUTH_REQUIRED`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: "`NOT_FOUND`: no such device among the owner's businesses."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          description: Any other error.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/sync/events:
    post:
      operationId: pushEvents
      tags: [sync]
      summary: Pushes a register's outbox events (E17-T04, ADR-010).
      description: >-
        Events are applied in `localSequence` order, each in its own transaction under a lock on
        the register's sync row, and are acknowledged only once committed. A repeated event gets
        `duplicate` with its first outcome (`originalStatus`); the same `eventId` with another
        envelope gets `rejected: EVENT_ID_REUSED`. A gap gives `out_of_order` with
        `expectedSequence`; an unknown type or newer `schemaVersion` gives
        `rejected: EVENT_VERSION_UNSUPPORTED` without being acknowledged; a `transient` result
        stops the batch. `ackSequence` is the highest sequence the server has committed.
      security:
        - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushRequest"
      responses:
        "200":
          description: Per-event results, in order, up to where the batch stopped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushResponse"
        "401":
          description: "`AUTH_REQUIRED` or `SYNC_DEVICE_REVOKED`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: "`PERMISSION_DENIED`: the request or an event names another register or business."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: "`VALIDATION_FAILED`: more than 200 events or 2 MB."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          description: Any other error.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/sync/ack:
    get:
      operationId: getAck
      tags: [sync]
      summary: The highest local sequence the server has committed for the token's register.
      security:
        - deviceToken: []
      responses:
        "200":
          description: The ack.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AckResponse"
        "401":
          description: "`AUTH_REQUIRED` or `SYNC_DEVICE_REVOKED`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          description: Any other error.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    userToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Owner token from /v1/auth/login (kind `user`, 15 minutes)."
    deviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Device token (kind `device`, 15 minutes); the device must still be active."
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, version, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          description: Version of the running API build.
        database:
          type: string
          enum: [ok, unavailable, not_configured]
    VersionPolicy:
      type: object
      additionalProperties: false
      required: [minSupported, latest]
      properties:
        minSupported:
          type: string
          description: Desktop builds below this version receive 426 SYNC_UPGRADE_REQUIRED.
        latest:
          type: string
        updateUrl:
          type: string
          format: uri
    NewBusiness:
      type: object
      required: [businessId, name, countryCode, timezone, currencyCode, currencyExponent, pricesIncludeTax]
      properties:
        businessId: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 80}
        countryCode: {type: string, pattern: "^[A-Z]{2}$"}
        timezone: {type: string, maxLength: 64}
        currencyCode: {type: string, pattern: "^[A-Z]{3}$"}
        currencyExponent: {type: integer, minimum: 0, maximum: 4}
        pricesIncludeTax: {type: boolean}
    Business:
      type: object
      required: [businessId, name, countryCode, timezone, currencyCode, currencyExponent, pricesIncludeTax, version, status]
      properties:
        businessId: {type: string, format: uuid}
        name: {type: string}
        countryCode: {type: string}
        timezone: {type: string}
        currencyCode: {type: string}
        currencyExponent: {type: integer}
        pricesIncludeTax: {type: boolean}
        version: {type: integer}
        status: {type: string, enum: [active, suspended, deleted]}
    RegisterDevice:
      type: object
      required: [businessId, registerId, registerName, registerCode, locationId, locationName, installationId, appVersion]
      properties:
        businessId: {type: string, format: uuid}
        registerId: {type: string, format: uuid}
        registerName: {type: string}
        registerCode: {type: string, pattern: "^[A-Z0-9]{1,6}$"}
        locationId: {type: string, format: uuid}
        locationName: {type: string}
        installationId: {type: string, format: uuid}
        appVersion: {type: string}
        osInfo: {type: [string, "null"]}
        replaceExisting: {type: boolean, default: false}
    DeviceCredentials:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        deviceId: {type: string, format: uuid, description: Present on registration.}
        accessToken: {type: string, description: "EdDSA JWT, kind `device`, with businessId, registerId and deviceId claims."}
        refreshToken: {type: string, description: Opaque; keep it in the OS credential store.}
        expiresIn: {type: integer, description: Seconds (900).}
    Device:
      type: object
      required: [deviceId, businessId, registerId, appVersion, status, registeredAt]
      properties:
        deviceId: {type: string, format: uuid}
        businessId: {type: string, format: uuid}
        registerId: {type: string, format: uuid}
        appVersion: {type: string}
        osInfo: {type: [string, "null"]}
        status: {type: string, enum: [active, revoked]}
        registeredAt: {type: string, format: date-time}
        lastSeenAt: {type: [string, "null"], format: date-time}
        revokedAt: {type: [string, "null"], format: date-time}
    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
          writeOnly: true
    SignupResponse:
      type: object
      required: [accountId]
      properties:
        accountId:
          type: string
          format: uuid
    LoginResponse:
      type: object
      required: [userAccessToken, expiresIn]
      properties:
        userAccessToken:
          type: string
          description: EdDSA JWT; claims `sub` (account), `kind` = `user`, `iss`, `iat`, `exp`.
        expiresIn:
          type: integer
          description: Seconds (900).
    EventEnvelope:
      type: object
      additionalProperties: false
      description: PRD §11.3. The payload follows `contracts/events/current/<eventType>.v<schemaVersion>.json`.
      required: [eventId, businessId, locationId, registerId, localSequence, eventType, schemaVersion, aggregateType, aggregateId, occurredAt, payload]
      properties:
        eventId: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        registerId: { type: string, format: uuid }
        localSequence: { type: integer, minimum: 1 }
        eventType: { type: string }
        schemaVersion: { type: integer, minimum: 1 }
        aggregateType: { type: string }
        aggregateId: { type: string }
        baseVersion:
          type: [integer, "null"]
          minimum: 0
          description: Master data only (ADR-011).
        occurredAt: { type: string, format: date-time }
        payload: { type: object }
    PushRequest:
      type: object
      additionalProperties: false
      required: [registerId, events]
      properties:
        registerId:
          type: string
          format: uuid
          description: Must be the token's register (else 403).
        events:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/EventEnvelope"
    ResultStatus:
      type: string
      enum: [applied, duplicate, conflict, rejected, out_of_order, transient]
    EventResult:
      type: object
      additionalProperties: false
      required: [eventId, localSequence, status]
      properties:
        eventId: { type: string, format: uuid }
        localSequence: { type: integer, minimum: 0 }
        status: { $ref: "#/components/schemas/ResultStatus" }
        serverSeq: { type: integer }
        serverVersion: { type: integer, minimum: 0 }
        serverSnapshot: {}
        code:
          type: string
          description: "conflict: VERSION, BARCODE_TAKEN, SKU_TAKEN; rejected: EVENT_ID_REUSED, EVENT_VERSION_UNSUPPORTED, EVENT_INVALID, SNAPSHOT_MISMATCH; transient: ORIGINAL_SALE_PENDING, APPLIER_UNAVAILABLE, SERVER_BUSY."
        detail: { type: string }
        expectedSequence: { type: integer, minimum: 1 }
        originalStatus: { $ref: "#/components/schemas/ResultStatus" }
    PushResponse:
      type: object
      additionalProperties: false
      required: [ackSequence, serverTime, results]
      properties:
        ackSequence:
          type: integer
          minimum: 0
          description: The client never moves its own ack past this.
        serverTime: { type: string, format: date-time }
        results:
          type: array
          items:
            $ref: "#/components/schemas/EventResult"
    AckResponse:
      type: object
      additionalProperties: false
      required: [registerId, ackSequence, serverTime]
      properties:
        registerId: { type: string, format: uuid }
        ackSequence: { type: integer, minimum: 0 }
        serverTime: { type: string, format: date-time }
    Problem:
      type: object
      description: RFC 9457 problem details with a catalogued error code.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          $ref: "#/components/schemas/ErrorCode"
    ErrorCode:
      type: string
      description: Catalogued error codes (docs/errors.md). Must equal pos_domain::ErrorCode.
      enum:
            - SESSION_LOCKED
            - AUTH_PIN_INVALID
            - AUTH_LOCKED_OUT
            - PERMISSION_DENIED
            - APPROVAL_REQUIRED
            - APPROVAL_INVALID
            - VALIDATION_FAILED
            - CATALOG_DUPLICATE_BARCODE
            - CATALOG_DUPLICATE_SKU
            - CATALOG_NOT_FOUND
            - SCAN_NOT_FOUND
            - SCAN_INVALID
            - CART_REVISION_MISMATCH
            - CART_EMPTY
            - PRICING_DISCOUNT_EXCEEDS
            - TENDER_INSUFFICIENT
            - TENDER_CHANGE_FROM_NON_CASH
            - TENDER_OVERPAY_NON_CASH
            - STOCK_NEGATIVE_BLOCKED
            - RETURN_QTY_EXCEEDS
            - RETURN_REFUND_MISMATCH
            - CASH_SESSION_REQUIRED
            - CASH_SESSION_ALREADY_OPEN
            - PRINT_ADAPTER_UNAVAILABLE
            - PRINT_UNKNOWN_OUTCOME
            - STORE_BUSY
            - STORE_IO
            - STORE_CORRUPT
            - STORE_SCHEMA_TOO_NEW
            - SYNC_NOT_LINKED
            - SYNC_DEVICE_REVOKED
            - SYNC_UPGRADE_REQUIRED
            - SYNC_OUT_OF_ORDER
            - AUTH_CREDENTIALS_INVALID
            - AUTH_EMAIL_TAKEN
            - AUTH_RATE_LIMITED
            - AUTH_REQUIRED
            - SYNC_REGISTER_IN_USE
            - SYNC_BUSINESS_ID_TAKEN
            - NOT_FOUND
            - CONFLICT_VERSION
            - INTERNAL

[package]
name = "pos-sync-http"
description = "The register's HTTP side of sync (E17-T08): the cloud transport with token refresh, the owner's account calls, and credential stores."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
pos-application.workspace = true
pos-domain.workspace = true
pos-sync.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
uuid.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }

[lints]
workspace = true

[dev-dependencies]
serde_yaml_ng.workspace = true

[package]
name = "pos-devtools"
description = "Developer tooling (E00-T04): reset and seed a till database through the application services."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
# Run through `cargo xtask db-reset` / `cargo xtask seed`.
name = "pos-dev"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
argon2.workspace = true
pos-application.workspace = true
pos-domain.workspace = true
pos-local-db.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["sqlite"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

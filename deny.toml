# cargo-deny policy (E00-T02). Run: cargo deny check

[graph]
all-features = false

[advisories]
# Unmaintained crates deep in the Tauri/GTK tree are reported but do not block; known
# vulnerabilities do. Exceptions need an issue link and an expiry review date.
unmaintained = "workspace"
ignore = []

[licenses]
confidence-threshold = 0.9
# Permissive licences only. Copyleft (GPL/AGPL/LGPL) is not allowed in the shipped app.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "BSL-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "0BSD",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  { crate = "openssl", reason = "use rustls (smaller attack surface, no system OpenSSL on Windows)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
